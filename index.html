<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yentra - The most powerful AI in talent acquisition</title>
  </head>
  <body class="bg-background text-foreground overflow-x-hidden m-0 p-0">
    <div id="app" class="relative min-h-screen flex flex-col">
      <!-- Video Wrapper -->
      <div class="absolute inset-0 w-full h-full overflow-hidden -z-20">
        <video id="hero-video" class="absolute inset-0 w-full h-full object-cover" muted playsinline preload="auto">
          <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_065045_c44942da-53c6-4804-b734-f9e07fc22e08.mp4" type="video/mp4" />
        </video>
      </div>

      <!-- Blurred Overlay Shape -->
      <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[984px] h-[527px] opacity-90 bg-gray-950 blur-[82px] pointer-events-none -z-10"></div>

      <!-- Hero Section Container -->
      <div class="relative z-10 flex flex-col flex-1 overflow-visible">
        
        <!-- Navbar -->
        <nav class="w-full py-5 px-8 flex flex-row justify-between items-center relative">
          <div class="flex items-center">
            <img src="/src/assets/logo.png" alt="Yentra Logo" class="h-[32px]" />
          </div>
          <div class="flex items-center gap-8">
            <button class="flex items-center gap-1 text-foreground/90 hover:text-foreground transition-colors font-medium">
              Features
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-0.5"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <button class="text-foreground/90 hover:text-foreground transition-colors font-medium">Solutions</button>
            <button class="text-foreground/90 hover:text-foreground transition-colors font-medium">Plans</button>
            <button class="flex items-center gap-1 text-foreground/90 hover:text-foreground transition-colors font-medium">
              Learning
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-0.5"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </div>
          <div class="flex items-center">
            <button class="heroSecondary px-4 py-2 text-sm">Sign Up</button>
          </div>
        </nav>
        
        <!-- Divider Line Below Navbar -->
        <div class="w-full h-[1px] bg-gradient-to-r from-transparent via-foreground/20 to-transparent mt-[3px]"></div>

        <!-- Hero Content -->
        <main class="flex-1 flex flex-col items-center justify-center text-center px-4 w-full max-w-7xl mx-auto">
          <h1 class="text-[220px] font-normal leading-[1.02] tracking-[-0.024em] font-display whitespace-nowrap">
            Yen<span class="bg-clip-text text-transparent bg-gradient-to-l from-[#fcd34d] via-[#a855f7] to-[#6366f1]">tra</span>
          </h1>
        </main>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
